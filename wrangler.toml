name = "impossible-chess"
compatibility_date = "2024-09-01"
pages_build_output_dir = "."

# Cloudflare D1 Database Binding for Permadeath Leaderboard
# To connect D1, either:
# Option A: Bind in Cloudflare Pages Dashboard -> Settings -> Functions -> D1 Database Bindings (Name: DB)
# Option B: Run `npx wrangler d1 create impossible-chess-db` and uncomment below with your real database_id:
#
# [[d1_databases]]
# binding = "DB"
# database_name = "impossible-chess-db"
# database_id = "<your-real-d1-uuid-here>"

